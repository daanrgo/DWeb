<!-- src/app/pages/order/order-form/order-form.component.html -->
<div class="card p-3">
    <h4>{{ editando ? 'Editar Orden' : 'Agregar Orden' }}</h4>
  
    <form (ngSubmit)="guardar()">
      <div class="mb-3">
        <label for="quantity" class="form-label">Cantidad</label>
        <input id="quantity" name="quantity" type="number" class="form-control" [(ngModel)]="order.quantity" required />
      </div>
  
      <div class="mb-3">
        <label for="comidaId" class="form-label">ID de Comida</label>
        <input id="comidaId" name="comidaId" type="number" class="form-control" [(ngModel)]="order.comidaId" required />
      </div>
  
      <div class="mb-3">
        <label for="billId" class="form-label">ID de Factura</label>
        <input id="billId" name="billId" type="number" class="form-control" [(ngModel)]="order.billId" required />
      </div>
  
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-primary me-2">{{ editando ? 'Actualizar' : 'Agregar' }}</button>
        <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
