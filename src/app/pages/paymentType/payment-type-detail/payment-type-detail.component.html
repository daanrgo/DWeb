<!-- src/app/pages/paymentType/payment-type-detail/payment-type-detail.component.html -->
<div class="detail-container" *ngIf="paymentType">
    <h3>Detalle del Tipo de Pago</h3>
  
    <form (ngSubmit)="guardar()">
      <div class="form-group">
        <label for="description">Descripción</label>
        <input
          id="description"
          name="description"
          type="text"
          class="form-control"
          [(ngModel)]="paymentType.description"
          required
          [readonly]="!editando"
        />
      </div>
  
      <div class="mt-3">
        <button type="submit" class="btn btn-success me-2" *ngIf="editando">Guardar</button>
        <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
