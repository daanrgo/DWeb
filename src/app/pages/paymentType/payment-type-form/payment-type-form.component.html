<!-- src/app/pages/paymentType/payment-type-form/payment-type-form.component.html -->

<div class="card p-3 shadow rounded">
    <h2 class="text-lg font-bold mb-4">
      {{ editando ? 'Editar Tipo de Pago' : 'Nuevo Tipo de Pago' }}
    </h2>
  
    <form (ngSubmit)="guardar()" #paymentForm="ngForm">
      <div class="mb-4">
        <label for="description" class="block text-sm font-medium text-gray-700">Descripción:</label>
        <input
          type="text"
          id="description"
          name="description"
          [(ngModel)]="paymentType.description"
          required
          class="mt-1 p-2 border rounded w-full"
        />
      </div>
  
      <div class="flex gap-2">
        <button type="submit" [disabled]="!paymentForm.form.valid" class="bg-blue-600 text-white px-4 py-2 rounded">
          Guardar
        </button>
        <button type="button" (click)="cancelar()" class="bg-gray-400 text-white px-4 py-2 rounded">
          Cancelar
        </button>
      </div>
    </form>
  </div>
