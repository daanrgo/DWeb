<!-- src/app/pages/adicional/adicional-detail/adicional-detail.component.html -->
<div class="card p-3 mb-3">
  <h3>{{ editando ? 'Editar Adicional' : 'Agregar Adicional' }}</h3>

  <form (ngSubmit)="guardar()">
    <div class="form-group mb-2">
      <label for="name">Nombre:</label>
      <input id="name" name="name" type="text" class="form-control" [(ngModel)]="adicional.name" required />
    </div>

    <div class="form-group mb-3">
      <label for="price">Precio:</label>
      <input id="price" name="price" type="number" class="form-control" [(ngModel)]="adicional.price" required />
    </div>

    <button type="submit" class="btn btn-primary me-2">
      {{ editando ? 'Actualizar' : 'Agregar' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
  </form>
</div>
