<!-- src/app/pages/adicional/adicional-table/adicional-table.component.html -->

<div class="container mt-4">
  <h2>Listado de Adicionales</h2>

  <a routerLink="/adicionales/crear" class="btn btn-success mb-3">
    <i class="fas fa-plus"></i> Añadir Adicional
  </a>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let adicional of adicionales">
        <td>{{ adicional.id }}</td>
        <td>{{ adicional.name }}</td>
        <td>{{ adicional.price | currency: 'COP':'symbol' }}</td>
        <td>
          <a [routerLink]="['/adicionales/editar', adicional.id]" class="btn btn-outline-primary btn-sm me-2" title="Editar">
            <i class="fas fa-edit"></i>
          </a>
          <button class="btn btn-outline-danger btn-sm" (click)="eliminar(adicional.id)" title="Eliminar">
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
