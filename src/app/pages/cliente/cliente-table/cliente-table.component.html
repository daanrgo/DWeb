<div class="container mt-4">
    <h2 class="mb-3">Lista de Clientes</h2>
  
    <button class="btn btn-success mb-3" (click)="nuevoCliente()">Agregar</button>
  
    <table class="table table-striped table-dark">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Password</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Dirección</th>
          <th>Opciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientes">
          <td>{{ cliente.id }}</td>
          <td>{{ cliente.username }}</td>
          <td>{{ cliente.password }}</td>
          <td>{{ cliente.name }}</td>
          <td>{{ cliente.lastName }}</td>
          <td>{{ cliente.email }}</td>
          <td>{{ cliente.phone }}</td>
          <td>{{ cliente.address }}</td>
          <td>
            <button class="btn btn-primary btn-sm me-2" (click)="editar(cliente)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="eliminarCliente(cliente.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <app-cliente-detail
      *ngIf="clienteSeleccionado"
      [cliente]="clienteSeleccionado"
      [editando]="modoEdicion"
      (onGuardar)="guardar($event)"
      (onCancelar)="cancelar()"
    ></app-cliente-detail>
  </div>
