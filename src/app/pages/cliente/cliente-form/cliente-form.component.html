<!-- src/app/pages/cliente/cliente-form/cliente-form.component.html -->

<div class="card p-3 mb-3">
    <h3>{{ editando ? 'Editar Cliente' : 'Agregar Cliente' }}</h3>
  
    <form (ngSubmit)="guardar()">
      <div class="form-group mb-2">
        <label for="username">Usuario:</label>
        <input id="username" name="username" type="text" class="form-control" [(ngModel)]="cliente.username" required />
      </div>
  
      <div class="form-group mb-2">
        <label for="password">Contraseña:</label>
        <input id="password" name="password" type="password" class="form-control" [(ngModel)]="cliente.password" required />
      </div>
  
      <div class="form-group mb-2">
        <label for="name">Nombre:</label>
        <input id="name" name="name" type="text" class="form-control" [(ngModel)]="cliente.name" required />
      </div>
  
      <div class="form-group mb-2">
        <label for="lastName">Apellido:</label>
        <input id="lastName" name="lastName" type="text" class="form-control" [(ngModel)]="cliente.lastName" required />
      </div>
  
      <div class="form-group mb-2">
        <label for="email">Correo:</label>
        <input id="email" name="email" type="email" class="form-control" [(ngModel)]="cliente.email" />
      </div>
  
      <div class="form-group mb-2">
        <label for="phone">Teléfono:</label>
        <input id="phone" name="phone" type="number" class="form-control" [(ngModel)]="cliente.phone" required />
      </div>
  
      <div class="form-group mb-3">
        <label for="address">Dirección:</label>
        <input id="address" name="address" type="text" class="form-control" [(ngModel)]="cliente.address" required />
      </div>
  
      <button type="submit" class="btn btn-primary me-2">{{ editando ? 'Actualizar' : 'Agregar' }}</button>
      <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    </form>
  </div>
