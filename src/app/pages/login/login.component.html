<!-- Sustituye tu <main> con este -->
    <main class="parte4">
        <div class="parte4-container">
          <!-- Social -->
          <div class="social-login">
            <button class="google-btn" (click)="loginWithGoogle()">
              <i class="bx bxl-google"></i> Continuar con Google
            </button>
            <button class="phone-btn">
              <i class="bx bxs-phone"></i> Continuar con tu celular
            </button>
            <button class="facebook-btn" (click)="loginWithFacebook()">
              <i class="bx bxl-facebook"></i> Continuar con Facebook
            </button>
          </div>
      
          <!-- Login -->
          <div class="login-form">
            <h2>Iniciar sesión</h2>
            <p>Ingresa los siguientes datos</p>
      
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <input type="text" formControlName="username" placeholder="Correo electrónico/Usuario" required />
              <input type="password" formControlName="password" placeholder="Contraseña" required />

              <div *ngIf="errorMessage" class="textoError">
                {{ errorMessage }}
              </div>
      
              <a class="forgot-password">¿Olvidaste tu contraseña?</a>
      
              <button type="submit" class="login-btn">INICIAR SESIÓN</button>
            </form>
      
            <div class="soy_nuevo">
              <p>No tienes una cuenta aún?</p>
              <button class="register-btn" routerLink="/clientes/crear">Soy nuevo</button>
            </div>
          </div>
        </div>
      </main>
