<div class="container mt-4">
    <h2 class="mb-3">Lista de Operadores</h2>
  
    <button class="btn btn-success mb-3" (click)="nuevoOperator()">Agregar</button>
  
    <table class="table table-striped table-dark">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Password</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Ubicación</th>
          <th>Opciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let operator of operators">
          <td>{{ operator.id }}</td>
          <td>{{ operator.username }}</td>
          <td>{{ operator.password }}</td>
          <td>{{ operator.name }}</td>
          <td>{{ operator.lastName }}</td>
          <td>{{ operator.location }}</td>
          <td>
            <button class="btn btn-primary btn-sm me-2" (click)="editar(operator)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="eliminarOperator(operator.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <app-operator-detail
      *ngIf="operatorSeleccionado"
      [operator]="operatorSeleccionado"
      [editando]="modoEdicion"
      (onGuardar)="guardar($event)"
      (onCancelar)="cancelar()"
    ></app-operator-detail>
  </div>
