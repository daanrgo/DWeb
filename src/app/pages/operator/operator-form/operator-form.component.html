<div class="card p-3 mt-4">
    <h4>{{ editando ? 'Editar Operador' : 'Agregar Operador' }}</h4>
  
    <form (ngSubmit)="guardar()">
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input id="username" name="username" class="form-control" [(ngModel)]="operator.username" required />
      </div>
  
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" [(ngModel)]="operator.password" required />
      </div>
  
      <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input id="name" name="name" class="form-control" [(ngModel)]="operator.name" required />
      </div>
  
      <div class="mb-3">
        <label for="lastName" class="form-label">Apellido</label>
        <input id="lastName" name="lastName" class="form-control" [(ngModel)]="operator.lastName" required />
      </div>
  
      <div class="mb-3">
        <label for="location" class="form-label">Ubicación</label>
        <input id="location" name="location" class="form-control" [(ngModel)]="operator.location" required />
      </div>
  
      <button type="submit" class="btn btn-primary me-2">{{ editando ? 'Actualizar' : 'Agregar' }}</button>
      <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    </form>
  </div>
