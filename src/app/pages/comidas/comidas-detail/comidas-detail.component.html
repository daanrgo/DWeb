<!-- src/app/pages/comidas/comida-detail/comidas-detail.component.html -->

<div class="card p-3 mb-3">
    <h3>{{ editando ? 'Editar Comida' : 'Agregar Comida' }}</h3>
  
    <form (ngSubmit)="guardar()">
      <div class="form-group mb-2">
        <label for="name">Nombre:</label>
        <input id="name" name="name" type="text" class="form-control" [(ngModel)]="comida.name" required />
      </div>
  
      <div class="form-group mb-2">
        <label for="price">Precio:</label>
        <input id="price" name="price" type="number" class="form-control" [(ngModel)]="comida.price" required />
      </div>
  
      <div class="form-group mb-2">
        <label for="description">Descripción:</label>
        <textarea id="description" name="description" class="form-control" [(ngModel)]="comida.description" rows="2"></textarea>
      </div>
  
      <div class="form-group mb-3">
        <label for="imagen">URL Imagen:</label>
        <input id="imagen" name="imagen" type="text" class="form-control" [(ngModel)]="comida.imagen" />
      </div>
  
      <button type="submit" class="btn btn-primary me-2">
        {{ editando ? 'Actualizar' : 'Agregar' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    </form>
  </div>
