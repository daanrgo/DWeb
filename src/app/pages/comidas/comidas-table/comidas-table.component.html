<div class="container">
  <h2 class="title">LISTA PRODUCTOS</h2>

  <div *ngIf="isLoading" class="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div class="table-responsive" *ngIf="!isLoading">
    <table class="table table-hover table-dark-custom">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Descripción</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let comida of comidas">
          <td>{{ comida.name }}</td>
          <td>{{ comida.price | currency:'COP':'symbol':'1.0' }}</td>
          <td>{{ comida.description }}</td>
          <td>
            <img *ngIf="comida.imagen" [src]="comida.imagen" [alt]="comida.name" class="img-thumbnail" />
            <span *ngIf="!comida.imagen">Sin imagen</span>
          </td>
          <td class="action-buttons">
            <button class="btn btn-outline-warning btn-sm" [routerLink]="['/comidas/editar', comida.id]">
              ✏
            </button>
            <button class="btn btn-outline-danger btn-sm" (click)="deleteComida(comida.id)">
              🗑
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!isLoading && comidas.length === 0" class="alert alert-info">
    No hay comidas disponibles
  </div>

  <button class="btn btn-primary mt-3" [routerLink]="['/comidas/crear']">AÑADIR PRODUCTO</button>
</div>
